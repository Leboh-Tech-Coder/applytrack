<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApplyTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 class="logo">ApplyTrack</h1>

            <nav>
                <a href="#" class="nav-link active">Dashboard</a>
                <a href="#" class="nav-link">Applications</a>
                <a href="#" class="nav-link">Settings</a>
            </nav>
        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header class="header">
                <div>
                    <h2>Dashboard</h2>
                    <p>Track and manage your job applications.</p>
                </div>

                <button class="profile-button">Profile</button>
            </header>


            <!-- Welcome Section -->
            <section class="welcome">
                <h2>Good afternoon, Lebo 👋</h2>
                <p>Here's an overview of your job search.</p>
            </section>


            <!-- Statistics -->
            <section class="stats">

                <div class="stat-card">
                   <h3>Total Applications</h3>
                   <p id="totalApplications">3</p>
                </div>

                <div class="stat-card">
                   <h3>In Progress</h3>
                   <p id="inProgress">3</p>
                </div>

                <div class="stat-card">
                   <h3>Interviews</h3>
                   <p id="interviews">1</p>
                </div>

                <div class="stat-card">
                   <h3>Offers</h3>
                   <p id="offers">0</p>
                </div>

            </section>


            <!-- Recent Applications -->
           <section class="applications">

    <div class="section-header">
        <h2>Recent Applications</h2>
        <button class="add-button" id="addApplicationBtn">
            + Add Application
        </button>
    </div>

    <form class="application-form" id="applicationForm">

        <div class="form-group">
            <label for="company">Company</label>
            <input
                type="text"
                id="company"
                placeholder="e.g. Amazon"
                required
            >
        </div>

        <div class="form-group">
            <label for="position">Position</label>
            <input
                type="text"
                id="position"
                placeholder="e.g. Graduate Software Developer"
                required
            >
        </div>

        <div class="form-group">
            <label for="status">Status</label>

            <select id="status">
                <option value="applied">Applied</option>
                <option value="interview">Interview</option>
                <option value="rejected">Rejected</option>
                <option value="offer">Offer</option>
            </select>
        </div>

        <button type="submit" class="save-button" id="saveButton">
            Save Application
        </button>

    </form>

                <div class="application-list" id="applicationList">

                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
